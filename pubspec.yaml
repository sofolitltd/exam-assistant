name: exam_assistant
description: "Daily Exam"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4
  cloud_firestore: ^6.6.0
  google_sign_in: ^7.2.0
  google_fonts: ^8.1.0
  fl_chart: ^1.2.0
  uuid: ^4.4.0
  go_router: ^14.8.0
  lucide_icons_flutter: ^3.1.14+2
  flutter_staggered_grid_view: ^0.7.0
  file_picker: ^11.0.2
  tex_text: ^0.1.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^4.0.4

flutter:
  uses-material-design: true
