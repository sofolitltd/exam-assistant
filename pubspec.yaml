name: exam_assistant
description: "Daily Exam"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3
  firebase_core: ^4.11.0
  flutter_secure_storage: ^11.2.0
  http: ^1.3.0
  google_fonts: ^8.1.0
  fl_chart: ^1.2.0
  go_router: ^14.8.0
  lucide_icons_flutter: ^3.1.14+2
  flutter_staggered_grid_view: ^0.7.0
  tex_text: ^0.1.9
  flutter_tts: ^4.2.3
  flutter_local_notifications: ^19.2.1
  timezone: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^4.0.4
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "assets/icon/app_icon_background.png"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#2446C7"
    theme_color: "#2446C7"

flutter_native_splash:
  color: "#F6F6F3"
  image: "assets/icon/splash_logo.png"
  color_dark: "#16181D"
  image_dark: "assets/icon/splash_logo.png"
  android_12:
    image: "assets/icon/splash_android12.png"
    icon_background_color: "#2446C7"
    image_dark: "assets/icon/splash_android12.png"
    icon_background_color_dark: "#1B379E"
  web: false

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
